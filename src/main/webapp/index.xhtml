<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://primefaces.org/ui">
    <h:head>
        <title>Spring Boot + PrimeFaces</title>
    </h:head>
    <h:body>
        <h:form>
            <p:panel header="Prueba Spring Boot con PrimeFaces" style="width: 50%; margin: 30px auto;">
                <h:panelGrid columns="2" cellpadding="5">
                    <p:outputLabel value="Ingresa tu nombre:" />
                    <p:inputText value="#{usuarioBean.textoInput}">
                        <p:ajax event="keyup" listener="#{usuarioBean.transformarTexto}" update="lblResultado" />
                    </p:inputText>
                </h:panelGrid>
                
                <br/>
                <h:outputText id="lblResultado" value="#{usuarioBean.mensajeResultado}" 
                              style="color: #007bff; font-weight: bold;" />
            </p:panel>
        </h:form>
    </h:body>
</html>
